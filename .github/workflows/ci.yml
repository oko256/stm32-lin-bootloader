# CI WORKFLOW
# ===========
# Runs on pushes to main and on all pull requests.
# Parallel jobs for:
# 1. typos spell check
# 2. clang-format check (same directories as run-clang-format.sh)
# 3. build and run the host unit tests (test/), including the host tool's tests against the
#    simulated bootloader (tools/linboot/tests)
# The firmware itself is not built here: the presets are an example for one board, which an
# integrator customizes for their own.

name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs: if a new commit is pushed to a PR branch, cancel the previous runs
# for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ========================
  # Job 1: typos spell check
  # ========================

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Recommended for checkout action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check spelling
        uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d # v1.44.0

  # =========================
  # Job 2: clang-format check
  # =========================

  formatting:
    name: Formatting Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Recommended for checkout action
    strategy:
      matrix:
        # Keep in sync with run-clang-format.sh.
        path:
          - 'src'
          - 'test'
          - 'examples'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run clang-format style check for C/C++/Protobuf programs.
        uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          check-path: ${{ matrix.path }}
          clang-format-version: 19

  # ===============================
  # Job 3: build and run unit tests
  # ===============================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # Recommended for checkout action
    defaults:
      run:
        working-directory: test
    steps:
      # No submodules: the host tests only use the bootloader core, not minlin.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The oldest Python the host tool supports (see README.md).
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Install the host tool's test dependencies
        run: python -m pip install pytest pyserial

      - name: Install CMake
        uses: lukka/get-cmake@ea83089aa35e08e459464341fe24ad024ee2466f # v4.3.1

      # The host tool's tests (test_host_tool) run with the Python found here.
      - name: Configure
        run: cmake --preset test -DPython3_EXECUTABLE="$(command -v python)"

      - name: Build
        run: cmake --build --preset test

      - name: Run tests
        run: ctest --preset test
